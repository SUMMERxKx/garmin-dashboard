<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The dashboard's own mark: a heartbeat trace on the same near-black ground and in the
    same telemetry blue as the interface.

    Drawn for 16 pixels, which is the size it is nearly always seen at. That constraint
    decides everything here: one shape, one colour, a thick stroke, and a wide flat
    baseline either side of the spike so the shape still reads as a heartbeat rather than
    as a smudge when it is shrunk into a browser tab.

    A rounded square rather than a bare glyph, because a tab strip is a row of small
    light rectangles and a dark tile is what separates this one from its neighbours.
  -->
  <rect width="32" height="32" rx="7" fill="#0c0d10"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#262a31"/>
  <path
    d="M4 17h5.4l1.7-3.1 2.6 9.2 3-14.9 2.4 8.8H28"
    fill="none"
    stroke="#5ba9e8"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
