[project]
name = "garmin-health-dashboard"
version = "0.1.0"
description = "Personal health dashboard: Garmin ingestion, deterministic health engine, nutrition and energy balance."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Deliberately NOT in the base dependencies: backend/core must never import these.
# The architecture test in tests/test_architecture.py enforces that.
garmin = ["garminconnect>=0.2.20"]
cli    = ["typer>=0.12", "pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.core", "backend.providers", "backend.adapters"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
