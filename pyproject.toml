[project]
name = "garmin-health-dashboard"
version = "0.1.0"
description = "Personal health dashboard: Garmin ingestion, deterministic health engine, nutrition and energy balance."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Deliberately NOT in the base dependencies: backend/core must never import these.
garmin = ["garminconnect>=0.2.20"]
# Runtime AWS access. Kept out of the base install so `backend/core` can never
# reach for it.
aws    = ["boto3>=1.34"]
# The web API. `mangum` is the adapter that lets the exact same FastAPI app run
# inside a Lambda function later, with no code changes.
api    = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "mangum>=0.17"]
infra  = ["aws-cdk-lib>=2.140", "constructs>=10.3"]
cli    = ["typer>=0.12", "pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "httpx2",
    "moto[dynamodb]>=5.0",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the NEW build is an installed package. We add each sub-package to this list as
# we create it, so this line is always an honest inventory of what exists.
packages = [
    "backend",
    "backend.garmin",
    "backend.cli",
    "backend.store",
    "backend.food",
    "backend.body",
    "backend.engine",
    "backend.api",
    # The CDK application. Listed so `import infra.stacks.data_stack` works from the
    # tests, which synthesise the stack in memory and assert against the template.
    "infra",
    "infra.stacks",
    # One-off operational scripts. A package rather than loose files so they can import
    # the backend the same way everything else does, with `python -m scripts.name`.
    "scripts",
]

[tool.pytest.ini_options]
# Points at the new build only. The old code in reference/ is for reading, not running.
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Warnings are errors by default, so a deprecation in OUR code fails the build
    # rather than scrolling past.
    "error",
    # Not our code: starlette's test client imports a name anyio has deprecated. It is
    # their upgrade to make, and failing our suite over it would teach us to ignore the
    # rule above. Scoped to that one message so anything else still fails loudly.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# reference/ is the previous build, kept only so it can be read. It is not maintained,
# so linting it would produce noise about code we have deliberately frozen.
# `build/` is the Lambda deployment package: third-party libraries copied in by
# scripts/build_lambda.py. Linting someone else's shipped code produces thousands of
# findings about code we cannot change.
extend-exclude = ["reference", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length -- handled by the formatter, and long comments are fine

    # This project deliberately prefers explicit, step-by-step code over compact code.
    # The rules below all push in the opposite direction: they ask you to collapse a
    # readable multi-line branch into a single dense expression. Readability for someone
    # meeting the code for the first time matters more here than brevity.
    "SIM103",  # "return the condition directly" -- an explicit if/return reads better
    "SIM108",  # "use a ternary" -- if/else on separate lines is easier to follow
    "SIM102",  # "combine nested ifs" -- nesting often mirrors the actual logic better
    "SIM110",  # "use any()" -- an explicit loop is clearer when the body is doing work
]

[tool.ruff.lint.isort]
# One import per line, always. `from x import a, b, c` saves a line and costs you the
# ability to see at a glance where anything came from -- and combined with importing
# modules rather than names, every usage site now says its own origin: `models.Food`,
# `garmin_client.fetch_one_day`.
force-single-line = true

# Per-file ignores are added at the moment the build needs them, with the reason beside
# each one.
[tool.ruff.lint.per-file-ignores]
# B008 flags a function call as a default argument, because Python evaluates it once
# at definition time. FastAPI relies on exactly that: `fastapi.Depends(open_database)`
# in a default is how an endpoint declares what it needs. It is the framework's idiom,
# not the mistake the rule is looking for.
"backend/api/server.py" = ["B008"]
# E402 flags an import that is not at the top of the file. In the CDK entry point the
# project root has to be put on `sys.path` BEFORE `from infra.stacks import ...`, because
# the cdk command runs app.py directly from inside the infra directory, where the parent
# package is not importable yet. The order is the point, so the rule is turned off here.
"infra/app.py" = ["E402"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
