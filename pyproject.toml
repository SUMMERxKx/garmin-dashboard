[project]
name = "garmin-health-dashboard"
version = "0.1.0"
description = "Personal health dashboard: Garmin ingestion, deterministic health engine, nutrition and energy balance."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Deliberately NOT in the base dependencies: backend/core must never import these.
# The architecture test in tests/test_architecture.py enforces that.
garmin = ["garminconnect>=0.2.20"]
# Runtime AWS access. Kept out of the base install so `backend/core` can never
# reach for it -- the architecture test enforces that boundary.
aws    = ["boto3>=1.34"]
infra  = ["aws-cdk-lib>=2.140", "constructs>=10.3"]
cli    = ["typer>=0.12", "pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.core", "backend.providers", "backend.adapters"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length -- handled by the formatter, and long comments are fine

    # This project deliberately prefers explicit, step-by-step code over compact code.
    # The rules below all push in the opposite direction: they ask you to collapse a
    # readable multi-line branch into a single dense expression. Readability for someone
    # meeting the code for the first time matters more here than brevity.
    "SIM103",  # "return the condition directly" -- an explicit if/return reads better
    "SIM108",  # "use a ternary" -- if/else on separate lines is easier to follow
    "SIM102",  # "combine nested ifs" -- nesting often mirrors the actual logic better
    "SIM110",  # "use any()" -- an explicit loop is clearer when the body is doing work
]

[tool.ruff.lint.isort]
# One import per line, always. `from x import a, b, c` saves a line and costs you the
# ability to see at a glance where anything came from -- and combined with importing
# modules rather than names, every usage site now says its own origin: `models.Food`,
# `keys.food_key`, `nutrition.day_totals`.
force-single-line = true

[tool.ruff.lint.per-file-ignores]
# Typer (and later FastAPI) are DESIGNED so that a parameter's default is a call:
#     def today(date_text: str = typer.Option(None, "--date")):
# That is how the framework knows a parameter is a command-line option rather than a
# plain argument. B008 ("do not call a function in an argument default") is a good rule
# in general and a false positive here, so it is switched off for these two packages
# only, rather than project-wide.
"backend/cli/*.py" = ["B008"]
# The probe script lives in scripts/ but imports from backend/, so it has to add the
# project root to the import path BEFORE those imports can work. That is exactly what
# E402 ("import not at top of file") warns about, and here it is unavoidable and
# explained in a comment at the point it happens.
"scripts/garmin_probe.py" = ["E402"]
"backend/api/*.py" = ["B008"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
