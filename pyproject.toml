[project]
name = "garmin-health-dashboard"
version = "0.1.0"
description = "Personal health dashboard: Garmin ingestion, deterministic health engine, nutrition and energy balance."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Deliberately NOT in the base dependencies: backend/core must never import these.
garmin = ["garminconnect>=0.2.20"]
# Runtime AWS access. Kept out of the base install so `backend/core` can never
# reach for it.
aws    = ["boto3>=1.34"]
# The web API. `mangum` is the adapter that lets the exact same FastAPI app run
# inside a Lambda function later, with no code changes.
api    = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "mangum>=0.17"]
infra  = ["aws-cdk-lib>=2.140", "constructs>=10.3"]
cli    = ["typer>=0.12", "pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "httpx2",
    "moto[dynamodb]>=5.0",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the NEW build is an installed package. We add each sub-package to this list as
# we create it, so this line is always an honest inventory of what exists.
packages = ["backend", "backend.garmin", "backend.cli", "backend.store", "backend.food"]

[tool.pytest.ini_options]
# Points at the new build only. The old code in reference/ is for reading, not running.
testpaths = ["backend/tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Warnings are errors by default, so a deprecation in OUR code fails the build
    # rather than scrolling past.
    "error",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# reference/ is the previous build, kept only so it can be read. It is not maintained,
# so linting it would produce noise about code we have deliberately frozen.
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length -- handled by the formatter, and long comments are fine

    # This project deliberately prefers explicit, step-by-step code over compact code.
    # The rules below all push in the opposite direction: they ask you to collapse a
    # readable multi-line branch into a single dense expression. Readability for someone
    # meeting the code for the first time matters more here than brevity.
    "SIM103",  # "return the condition directly" -- an explicit if/return reads better
    "SIM108",  # "use a ternary" -- if/else on separate lines is easier to follow
    "SIM102",  # "combine nested ifs" -- nesting often mirrors the actual logic better
    "SIM110",  # "use any()" -- an explicit loop is clearer when the body is doing work
]

[tool.ruff.lint.isort]
# One import per line, always. `from x import a, b, c` saves a line and costs you the
# ability to see at a glance where anything came from -- and combined with importing
# modules rather than names, every usage site now says its own origin: `models.Food`,
# `garmin_client.fetch_one_day`.
force-single-line = true

# NOTE: per-file-ignores were removed along with the old code. We add each one back at
# the moment the new build actually needs it, with the reason written beside it.

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
